# Copy to <jnd repo>/.github/workflows/validate-more-apps.yml
# and put validate.mjs + more_apps.schema.json under tools/more-apps/ in that repo (or adjust paths).
name: Validate more_apps.json

on:
  push:
    paths:
      - "2k26/more_apps.json"
      - "tools/more-apps/**"
  pull_request:
    paths:
      - "2k26/more_apps.json"
      - "tools/more-apps/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/more-apps/validate.mjs 2k26/more_apps.json
